name: Check links

on:
  push:
    paths: ['**/*.md']
  pull_request:
    paths: ['**/*.md']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403/429 are bot-blocks (gatesnotes, tim.blog, ...), not dead links
          args: --no-progress --accept '200..=206,403,429' './**/*.md'
          fail: true

      - name: Open issue on broken links (scheduled runs)
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Link check failed: broken links found'
          content-filepath: ./lychee/out.md
          labels: link-rot
